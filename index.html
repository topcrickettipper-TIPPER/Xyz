<script>

let seconds = 15;

const count = document.getElementById("count");
const progressBar = document.getElementById("progressBar");

const timer = setInterval(function() {

  seconds--;

  count.textContent = seconds;

  progressBar.style.width =
    ((seconds / 15) * 100) + "%";

  if (seconds <= 0) {

    clearInterval(timer);

    count.textContent = "0";

    progressBar.style.width = "0%";

  }

}, 1000);

</script>
